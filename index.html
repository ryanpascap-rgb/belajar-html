<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Halaman web latihan Ryan Pasca: profil, hobi, dan jadwal belajar.">
    <title>Halaman Pertama Saya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Halo, Dunia!</h1>
        <nav>
            <a href="#tentang">Tentang</a>
            <a href="#hobi">Hobi</a>
            <a href="#jadwal">Jadwal</a>
            <a href="#kontak">Kontak</a>
        </nav>
    </header>

    <main>
        <section id="tentang">
            <h2>Tentang Saya</h2>
            <div class="profil">
                <img src="20260109_144054.jpg" alt="Papan Informasi tentang Kawasan Lingang, Shanghai" width="200">
                <p>Ini halaman web pertama saya.</p>
            </div>
        </section>
        <section id="kontak">
        <h2>Hubungi Saya</h2>
        <form>
            <p>
                <label for="nama">Nama</label><br>
                <input type="text" id="nama" name="nama" required>
            </p>

            <p>
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="topik">Topik</label><br>
                <select id="topik" name="topik">
                    <option value="umum">Pertanyaan umum</option>
                    <option value="kerja">Kerja sama</option>
                    <option value="lainnya">Lainnya</option>
                </select>
            </p>

            <p>
                <label for="pesan">Pesan</label><br>
                <textarea id="pesan" name="pesan" rows="5"></textarea>
            </p>

            <p>
                <input type="checkbox" id="setuju" name="setuju">
                <label for="setuju">Saya setuju untuk dihubungi kembali</label>
            </p>

            <button type="submit">Kirim</button>
        </form>
    </section>
    
        <section id="hobi">
            <h2>Hobi Saya</h2>
            <ul>
                <li>Membaca</li>
                <li>Berolahraga</li>
                <li>Belajar HTML</li>
            </ul>
        </section>

        <section id="jadwal">
            <h2>Jadwal Belajar</h2>
            <table>
                <thead>
                    <tr>
                        <th>Hari</th>
                        <th>Materi</th>
                        <th>Durasi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Senin</td>
                        <td>Tag dasar HTML</td>
                        <td>1 jam</td>
                    </tr>
                    <tr>
                        <td>Rabu</td>
                        <td>Tabel dan formulir</td>
                        <td>1 jam</td>
                    </tr>
                    <tr>
                        <td>Jumat</td>
                        <td>Latihan proyek</td>
                        <td>2 jam</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Ryan Pasca</p>
    </footer>
</body>
</html>
